<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Submit an idea</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{display:block;font-size:13px;font-weight:600;color:#A39AA2;margin:18px 0 8px}
.inp{width:100%;box-sizing:border-box;border-radius:14px;border:1.5px solid #3A3439;background:#141116;color:#F4EFEA;padding:14px 16px;font:400 16px/1.4 Inter,sans-serif}
.chip{height:38px;padding:0 13px;border-radius:19px;border:1.5px solid #3A3439;background:transparent;color:#F4EFEA;font:500 13px Inter,sans-serif}
.chip.on{background:#F0287A;border-color:#F0287A;color:#FFFFFF;font-weight:600}
.tg{width:51px;height:31px;border-radius:16px;border:0;padding:2px;display:flex;flex-shrink:0}
.tg span{width:27px;height:27px;border-radius:50%;background:#fff;display:block}
.tg.off{background:#3A3439;justify-content:flex-start}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C10; color: #F4EFEA; font-family: Inter, sans-serif; padding: 54px 24px 34px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
    <a href="Ideas.dc.html" style="height: 44px; display: flex; align-items: center; color: #A39AA2; font: 500 15px Inter, sans-serif; text-decoration: none">Cancel</a>
    <span style="font-size: 15px; font-weight: 600">New idea</span>
    <span style="width: 52px"></span>
  </div>
  <h1 style="margin: 8px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.5px">What should we build?</h1>
  <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #A39AA2">The clearer the problem, the faster we can fix it.</p>
  <label class="lbl" for="it">Your idea</label>
  <input id="it" class="inp" value="Voice intro on profiles">
  <label class="lbl" for="iw">Why it matters to you</label>
  <textarea id="iw" class="inp" rows="3" style="resize: none">Photos and text don’t tell me if we’ll click. A 10-second voice note would.</textarea>
  <div class="lbl">Category</div>
  <div style="display: flex; flex-wrap: wrap; gap: 7px">
    <button class="chip on">New features</button><button class="chip">Safety</button><button class="chip">Profiles</button><button class="chip">Discover</button><button class="chip">Lounge</button><button class="chip">Bug</button>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; background: #17131A; border-radius: 16px">
    <div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 500">Post anonymously</div><div style="font-size: 12px; color: #A39AA2; margin-top: 2px">Otherwise shown as velvet_fox</div></div>
    <button class="tg off" aria-pressed="false" aria-label="Post anonymously"><span></span></button>
  </div>
  <div style="flex-grow: 1"></div>
  <button style="height: 56px; border-radius: 28px; border: 0; background: linear-gradient(100deg, #F0287A, #7B3CFF 55%, #3B7BFF); color: #FFFFFF; font: 600 16px Inter, sans-serif">Post idea</button>
  <div style="text-align: center; font-size: 12px; color: #A39AA2; margin-top: 8px">Your idea starts with your own upvote.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
