<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this; var st = this.state || {};
    var m = st.mask || 'bunny'; var apply = st.apply !== false;
    var ids = ['none', 'bunny', 'masq', 'kitten', 'blur'];
    var labels = { none: 'No mask, face visible', bunny: 'Face found · bunny mask follows it', masq: 'Face found · masquerade mask', kitten: 'Face found · kitten mask', blur: 'Face found · blurred' };
    var v = { isBunny: m === 'bunny', isMasq: m === 'masq', isKitten: m === 'kitten', isBlur: m === 'blur', status: labels[m],
      applyCls: apply ? 'tg on' : 'tg off', applyPressed: apply ? 'true' : 'false',
      toggleApply: function () { self.setState({ apply: !apply }); } };
    ids.forEach(function (id, i) {
      v['c' + i] = id === m ? 'mk on' : 'mk';
      v['a' + i] = id === m ? 'true' : 'false';
      v['p' + i] = function () { self.setState({ mask: id }); };
    });
    return v;
  }
}
</script>
