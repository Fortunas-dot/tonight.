<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover distance radar</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:500 11px Inter,sans-serif;width:68px;padding:8px 0}
.rg{position:absolute;border-radius:50%;border:1px dashed #3A3439}
.rl{position:absolute;font-size:10px;font-weight:600;letter-spacing:1px;color:#A39AA2;background:#0E0C10;padding:0 4px}
.b{position:absolute;width:46px;height:46px;border-radius:50%;padding:3px;box-sizing:border-box;border:0;background:#3A3439}
.b span{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #0E0C10;box-sizing:border-box;background:repeating-linear-gradient(135deg,#2A2228 0 7px,#2F262D 7px 14px)}
.b.glow{background:linear-gradient(135deg,#F0287A,#7B3CFF,#3B7BFF);box-shadow:0 0 12px rgba(123,60,255,.5)}
.b.fire{background:conic-gradient(#FFD27A,#FF8A3D,#F0287A,#FF8A3D,#FFD27A);box-shadow:0 0 16px rgba(255,138,61,.6)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(240,40,122,.28),rgba(123,60,255,.08) 50deg,rgba(14,12,16,0) 70deg);animation:spin 6s linear infinite}
.me{position:absolute;left:146px;top:146px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#F0287A,#3B7BFF);display:flex;align-items:center;justify-content:center;font:700 12px Inter,sans-serif;color:#FFFFFF}
.me::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(240,40,122,.5);animation:ping 2s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.8);opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C10; color: #F4EFEA; font-family: Inter, sans-serif; padding-top: 54px; position: relative; overflow: hidden">

    <button class="b" aria-label="Noor, 1 to 3 km" style="left: 228px; top: 214px"><span></span></button>
    <button class="b glow" aria-label="Jules, 1 to 3 km" style="left: 100px; top: 236px"><span></span></button>
    <button class="b" aria-label="Alex, 3 to 5 km" style="left: 278px; top: 92px"><span></span></button>
    <button class="b" aria-label="Mara and Tom, 3 to 5 km" style="left: 14px; top: 196px"><span></span></button>
    <button class="b" aria-label="Kim, 3 to 5 km" style="left: 176px; top: 290px"><span></span></button>
  </div>
  <div style="margin: 18px 16px 0; padding: 14px; border-radius: 22px; background: #17131A; border: 1px solid #4A2A1E; display: flex; gap: 12px; align-items: center">
    <div style="width: 60px; height: 76px; border-radius: 14px; flex-shrink: 0; background: repeating-linear-gradient(135deg,#2A2228 0 8px,#2F262D 8px 16px)"></div>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font: 700 19px 'Bricolage Grotesque', sans-serif">Lina, 29</div>
      <div style="font-size: 12px; color: #A39AA2; margin-top: 2px">1–3 km · live until 01:00</div>
      <div style="display: flex; gap: 6px; margin-top: 6px"><span style="height: 24px; padding: 0 8px; border-radius: 12px; background: #F0287A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center">7/7 fit</span><span style="height: 24px; padding: 0 8px; border-radius: 12px; background: #2A1A12; color: #FFB070; font-size: 11px; font-weight: 700; display: flex; align-items: center">On fire</span></div>
    </div>
    <button aria-label="Like Lina" style="width: 52px; height: 52px; border-radius: 50%; border: 0; flex-shrink: 0; background: linear-gradient(135deg, #F0287A, #3B7BFF); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8.2 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.6 0 5.8 3.7 4.5 7.1C19.5 16.4 12 21 12 21z"></path></svg></button>
  </div>
  <div style="text-align: center; font-size: 11px; color: #A39AA2; margin-top: 10px">Placed by distance band only. Direction is shuffled, so nobody can be located.</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #0E0C10; border-top: 1px solid #221E24; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 4px">
    <button class="tab" style="color: #F0287A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"></rect></svg>Discover</button>
    <button class="tab" style="color: #A39AA2"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.3-8.6-8.8C2.2 8 4.2 4.8 7.4 4.8c1.9 0 3.4 1 4.6 2.6 1.2-1.6 2.7-2.6 4.6-2.6 3.2 0 5.2 3.2 4 6.4C19 15.7 12 20 12 20z"></path></svg>Likes you</button>
    <button class="tab" style="color: #A39AA2"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Chats</button>
    <button class="tab" style="color: #A39AA2"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.3 3 2.5 3-1-3 0-6 0-8z"></path></svg>Lounge</button>
    <button class="tab" style="color: #A39AA2"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</button>
  </div>
</div>
</x-dc>
