<style>
body{margin:0}
a{color:#F4EFEA}a:hover{color:#FFFFFF}
.orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.o1{width:520px;height:520px;left:-80px;top:-200px;background:radial-gradient(circle at 40% 40%,rgba(240,40,122,.75),rgba(123,60,255,.45) 50%,rgba(0,0,0,0) 72%);animation:v2a 20s ease-in-out infinite}
.o2{width:420px;height:420px;right:-200px;top:40px;background:radial-gradient(circle,rgba(59,123,255,.55),rgba(0,0,0,0) 70%);animation:v2a 26s ease-in-out infinite reverse}
@keyframes v2a{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,40px) scale(1.08)}}
.cta{background:linear-gradient(100deg,#F0287A,#7B3CFF 55%,#3B7BFF);background-size:220% 100%;animation:v2f 8s ease-in-out infinite}
@keyframes v2f{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.rise{animation:v2r 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes v2r{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
button{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

    </div>
  </div>
  <div class="rise" style="position: relative; margin-top: 36px; animation-delay: .12s">
    <button class="cta" style="width: 100%; height: 58px; border-radius: 29px; border: 0; color: #FFFFFF; font: 600 16px Inter, sans-serif; box-shadow: 0 12px 40px rgba(240,40,122,.28)">Get started</button>
    <button style="width: 100%; height: 52px; margin-top: 6px; border: 0; background: transparent; color: #F4EFEA; font: 500 15px Inter, sans-serif">I already have an account</button>
  </div>
  <p style="position: relative; margin: 12px 0 0; font-size: 11px; line-height: 1.5; color: #8A828C; text-align: center">18+ only. By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
