<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile basics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{display:block;font-size:13px;font-weight:600;color:#A39AA2;margin:18px 0 8px}
.inp{height:52px;box-sizing:border-box;border-radius:14px;border:1.5px solid #3A3439;background:#141116;color:#F4EFEA;padding:0 16px;font:400 16px Inter,sans-serif}
.pill{height:42px;padding:0 13px;border-radius:21px;border:1.5px solid #3A3439;background:transparent;color:#F4EFEA;font:500 14px Inter,sans-serif}
.pill.on{background:#F0287A;border-color:#F0287A;color:#FFFFFF;font-weight:600}
.pill.onb{background:#3B7BFF;border-color:#3B7BFF;color:#FFFFFF;font-weight:600}

/* liquid-motion v1 */
[style^="width: 390px; height: 844px"]{position:relative;isolation:isolate;overflow:hidden}
[style^="width: 390px; height: 844px"]::before,[style^="width: 390px; height: 844px"]::after{content:"";position:absolute;z-index:-1;pointer-events:none;filter:blur(34px);will-change:transform}
[style^="width: 390px; height: 844px"]::before{width:440px;height:440px;left:-170px;top:-150px;background:radial-gradient(circle at 35% 35%,rgba(240,40,122,.34),rgba(123,60,255,.16) 55%,rgba(0,0,0,0) 72%);animation:lq-blob 19s ease-in-out infinite}
[style^="width: 390px; height: 844px"]::after{width:420px;height:420px;right:-180px;bottom:-130px;background:radial-gradient(circle at 60% 60%,rgba(59,123,255,.30),rgba(123,60,255,.14) 55%,rgba(0,0,0,0) 72%);animation:lq-blob 23s ease-in-out infinite reverse}
@keyframes lq-blob{0%,100%{transform:translate(0,0) rotate(0) scale(1);border-radius:42% 58% 63% 37%/45% 40% 60% 55%}33%{transform:translate(50px,40px) rotate(50deg) scale(1.12);border-radius:62% 38% 35% 65%/55% 62% 38% 45%}66%{transform:translate(-30px,70px) rotate(-25deg) scale(.94);border-radius:38% 62% 55% 45%/62% 35% 65% 38%}}
[style*="linear-gradient(100deg, #F0287A"],[style*="linear-gradient(135deg, #F0287A, #3B7BFF)"],[style*="linear-gradient(90deg, #F0287A"]{background-size:240% 240% !important;animation:lq-flow 7s ease-in-out infinite}
@keyframes lq-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
button,a{transition:transform .35s cubic-bezier(.3,1.7,.45,1),filter .3s}
button:active,a:active{transform:scale(.94)}
button:hover,a:hover{filter:brightness(1.08)}
[style*="border-radius: 50%; background: #2BC48A"]{animation:lq-live 2.2s ease-out infinite}
@keyframes lq-live{0%{box-shadow:0 0 0 0 rgba(43,196,138,.65)}100%{box-shadow:0 0 0 9px rgba(43,196,138,0)}}
[style*="height: 84px; background: #0E0C10; border-top: 1px solid #221E24"]::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1.5px;background:linear-gradient(90deg,rgba(240,40,122,0),#F0287A,#7B3CFF,#3B7BFF,rgba(59,123,255,0));background-size:200% 100%;animation:lq-flow 6s ease-in-out infinite;opacity:.85}
[style="color: #F0287A"]{display:inline-block;transform-origin:50% 0;animation:lq-drip 3.4s ease-in-out infinite}
@keyframes lq-drip{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(1px) scale(.9,1.25)}55%{transform:translateY(2px) scale(1.1,.9)}}
.card,.row,.post,.chat,.t,.tile,.it,.ck,.pop,.opt,.fit{animation:lq-rise .8s cubic-bezier(.2,.85,.25,1) both}
.card:nth-child(2),.row:nth-child(2),.post:nth-child(2),.chat:nth-child(2),.t:nth-child(2),.tile:nth-child(2),.it:nth-child(2),.ck:nth-child(2),.pop:nth-child(2),.opt:nth-child(2){animation-delay:.07s}
.card:nth-child(3),.row:nth-child(3),.post:nth-child(3),.chat:nth-child(3),.t:nth-child(3),.tile:nth-child(3),.it:nth-child(3),.ck:nth-child(3),.pop:nth-child(3),.opt:nth-child(3){animation-delay:.14s}
.card:nth-child(4),.row:nth-child(4),.post:nth-child(4),.chat:nth-child(4),.t:nth-child(4),.tile:nth-child(4),.it:nth-child(4),.ck:nth-child(4),.pop:nth-child(4),.opt:nth-child(4){animation-delay:.21s}
.card:nth-child(n+5),.row:nth-child(n+5),.post:nth-child(n+5),.chat:nth-child(n+5),.t:nth-child(n+5),.tile:nth-child(n+5),.it:nth-child(n+5),.ck:nth-child(n+5),.pop:nth-child(n+5),.opt:nth-child(n+5){animation-delay:.28s}
@keyframes lq-rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C10; color: #F4EFEA; font-family: Inter, sans-serif; padding: 62px 24px 34px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #F4EFEA"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; height: 4px; background: #241F26; border-radius: 2px"><div style="width: 12.5%; height: 4px; background: #F0287A; border-radius: 2px"></div></div>
    <span style="font-size: 13px; color: #A39AA2">1 of 8</span>
  </div>
  <h1 style="margin: 20px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.6px; line-height: 1.1">Let’s start with you</h1>
  <p style="margin: 0; font-size: 14px; color: #A39AA2">Takes about two minutes. Only first name and age are shown.</p>
  <label class="lbl" for="fname">First name or nickname</label>
  <input id="fname" class="inp" value="Lina">
  <div class="lbl">Birthday</div>
  <div style="display: flex; gap: 8px">
    <label for="dd" style="position: absolute; left: -9999px">Day</label><input id="dd" class="inp" value="14" style="width: 70px; text-align: center">
    <label for="mm" style="position: absolute; left: -9999px">Month</label><input id="mm" class="inp" value="03" style="width: 70px; text-align: center">
    <label for="yy" style="position: absolute; left: -9999px">Year</label><input id="yy" class="inp" value="1997" style="flex-grow: 1; text-align: center">
  </div>
  <div style="font-size: 12px; color: #A39AA2; margin-top: 6px">Shown as “29”. Your birthday stays private.</div>
  <div class="lbl">I’m joining as</div>
  <div style="display: flex; gap: 8px">
    <button class="pill on">Just me</button>
    <button class="pill">A couple</button>
  </div>
  <div class="lbl">I am</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button class="pill on">Woman</button>
    <button class="pill">Man</button>
    <button class="pill">Non-binary</button>
    <button class="pill">More</button>
  </div>
  <div class="lbl">Show me</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button class="pill">Women</button>
    <button class="pill onb">Men</button>
    <button class="pill">Non-binary</button>
    <button class="pill">Couples</button>
  </div>
  <div style="flex-grow: 1"></div>
  <button style="height: 56px; border-radius: 28px; border: 0; background: linear-gradient(100deg, #F0287A, #7B3CFF 55%, #3B7BFF); color: #FFFFFF; font: 600 16px Inter, sans-serif">Continue</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
