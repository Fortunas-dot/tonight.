<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile basics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{display:block;font-size:13px;font-weight:600;color:#A39AA2;margin:18px 0 8px}
.inp{height:52px;box-sizing:border-box;border-radius:14px;border:1.5px solid #3A3439;background:#141116;color:#F4EFEA;padding:0 16px;font:400 16px Inter,sans-serif}
.pill{height:42px;padding:0 13px;border-radius:21px;border:1.5px solid #3A3439;background:transparent;color:#F4EFEA;font:500 14px Inter,sans-serif}
.pill.on{background:#F0287A;border-color:#F0287A;color:#FFFFFF;font-weight:600}
.pill.onb{background:#3B7BFF;border-color:#3B7BFF;color:#FFFFFF;font-weight:600}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C10; color: #F4EFEA; font-family: Inter, sans-serif; padding: 62px 24px 34px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #F4EFEA"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; height: 4px; background: #241F26; border-radius: 2px"><div style="width: 12.5%; height: 4px; background: #F0287A; border-radius: 2px"></div></div>
    <span style="font-size: 13px; color: #A39AA2">1 of 8</span>
  </div>
  <h1 style="margin: 20px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.6px; line-height: 1.1">Let’s start with you</h1>
  <p style="margin: 0; font-size: 14px; color: #A39AA2">Takes about two minutes. Only first name and age are shown.</p>
  <label class="lbl" for="fname">First name or nickname</label>
  <input id="fname" class="inp" value="Lina">
  <div class="lbl">Birthday</div>
  <div style="display: flex; gap: 8px">
    <label for="dd" style="position: absolute; left: -9999px">Day</label><input id="dd" class="inp" value="14" style="width: 70px; text-align: center">
    <label for="mm" style="position: absolute; left: -9999px">Month</label><input id="mm" class="inp" value="03" style="width: 70px; text-align: center">
    <label for="yy" style="position: absolute; left: -9999px">Year</label><input id="yy" class="inp" value="1997" style="flex-grow: 1; text-align: center">
  </div>
  <div style="font-size: 12px; color: #A39AA2; margin-top: 6px">Shown as “29”. Your birthday stays private.</div>
  <div class="lbl">I’m joining as</div>
  <div style="display: flex; gap: 8px">
    <button class="pill on">Just me</button>
    <button class="pill">A couple</button>
  </div>
  <div class="lbl">I am</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button class="pill on">Woman</button>
    <button class="pill">Man</button>
    <button class="pill">Non-binary</button>
    <button class="pill">More</button>
  </div>
  <div class="lbl">Show me</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button class="pill">Women</button>
    <button class="pill onb">Men</button>
    <button class="pill">Non-binary</button>
    <button class="pill">Couples</button>
  </div>
  <div style="flex-grow: 1"></div>
  <button style="height: 56px; border-radius: 28px; border: 0; background: linear-gradient(100deg, #F0287A, #7B3CFF 55%, #3B7BFF); color: #FFFFFF; font: 600 16px Inter, sans-serif">Continue</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
